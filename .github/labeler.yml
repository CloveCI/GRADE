# Path labels applied by pr-hygiene.yml: one per component, plus ci and docs.
backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**"

frontend:
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/ci/**"
          - "ruff.toml"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
